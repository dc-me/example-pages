<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SBA 308A - JavaScript Web Application - Cats</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      .btn-heart {
        color: pink;
        background: none;
        border: none;
        transition: all ease 0.2s;
      }
      .btn-heart:hover {
        color: var(--bs-danger);
      }
    </style>
  </head>
  <body>
    <nav class="navbar py-3 bg-primary navbar-expand-sm" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Cats</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto" role="tablist">
            <li class="nav-item">
              <button
                type="button"
                role="tab"
                class="nav-link"
                data-bs-toggle="tab"
                aria-selected="true"
                data-bs-target="#tab-random-cats"
              >
                Random Cats
              </button>
            </li>
            <li class="nav-item">
              <button
                type="button"
                role="tab"
                class="nav-link"
                data-bs-toggle="tab"
                data-bs-target="#tab-my-favorates"
              >
                My Favourites
              </button>
            </li>
          </ul>
          <form class="d-flex" role="search">
            <select class="form-select" aria-label="Default select example">
              <option selected>Select cat by breed</option>
            </select>
          </form>
        </div>
      </div>
    </nav>
    <div class="tab-content mt-4">
      <div class="tab-pane active" id="tab-random-cats" role="tabpanel">
        <div class="container">
          <div class="row">
            <h1 class="mb-4">Random Cats</h1>
          </div>
          <div class="row">
            <div class="col"></div>
            <div class="col"></div>
            <div class="col"></div>
          </div>
        </div>
      </div>
      <div class="tab-pane" id="tab-my-favorates" role="tabpanel">
        <div class="container">
          <div class="row">
            <h1 class="mb-4">My Favourite Cats</h1>
          </div>
          <div class="row">
            <div class="col"></div>
            <div class="col"></div>
            <div class="col"></div>
          </div>
        </div>
      </div>
      <div class="tab-pane" id="tab-cats-by-breed"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="../js/cats.js"></script>
  </body>
</html>
